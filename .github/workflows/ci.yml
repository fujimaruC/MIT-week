name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      # The demo cases, the demo screenshot and the Edukasi quiz images are
      # generated by the real scorer and forensics code. Regenerating them must
      # change nothing, or the committed copies have drifted from the code.
      - name: Demo data is reproducible
        run: |
          go run ./cmd/gendemo
          git status --porcelain
          test -z "$(git status --porcelain)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contrast gate
        run: npm run contrast
      - name: Host headers match security-headers.json
        run: npm run headers
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle size
        run: npm run size

  # PRD §5: performance, best practices and SEO >= 90, accessibility >= 95 on
  # every public route (Lighthouse mobile profile, median of 5 runs).
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lighthouse gate
        run: npm run lighthouse

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenAPI parses
        run: |
          pip install pyyaml
          python -c "import yaml; d=yaml.safe_load(open('api/openapi.yaml')); assert d['openapi'].startswith('3.'); print('openapi ok')"
      - name: Demo data in sync
        run: bash tools/check-demo-diff.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: frontend
        run: npm run build
      # Playwright starts the Go API (LLM_MOCK=true) and `vite preview` itself.
      # The audit spec runs against the real server on purpose: fixtures would
      # let a contract drift pass unnoticed.
      - name: End-to-end
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
