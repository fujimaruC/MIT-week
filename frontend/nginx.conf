# ponytail: unbuffered reverse proxy for SSE streaming; upgrade to TLS termination if publicly exposed
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Behind the tunnel and port forwards nginx does not know the public
    # scheme or port, so redirects carry only the path.
    absolute_redirect off;
    server_tokens off;
    # The backend accepts uploads up to MAX_UPLOAD_SIZE_MB (10); the default
    # 1m here rejected ordinary phone photos with 413.
    client_max_body_size 12m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers matching frontend/security-headers.json
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Browsers ignore HSTS over plain http, so this only bites behind the TLS edge.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Backend health check shortcut
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # AMBA API & SSE Stream Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE: /api/v1/audit/url)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cache immutable SvelteKit static chunks
    location /_app/ {
        expires 1y;
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA routing fallback. No folder match: asset folders such as /edukasi/
    # share their name with an app route, and a folder hit returned 403.
    location / {
        try_files $uri /index.html;
    }
}
