# ponytail: hot-reload dev override; mounts code into containers, preserves Linux node_modules
services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ENVIRONMENT=development
      - LLM_MOCK=${LLM_MOCK:-true}
      - PUBLIC_APP_URL=http://localhost:5173
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      - NINEROUTER_REASONING_EFFORT=${NINEROUTER_REASONING_EFFORT:-low}
      - LLM_EXTRA_BODY=${LLM_EXTRA_BODY:-}
      - FACT_RETRIEVAL=${FACT_RETRIEVAL:-true}
      - FACT_SEARCH_URL=${FACT_SEARCH_URL:-https://www.bing.com/news/search}
      - HARD_TIMEOUT_MS=${HARD_TIMEOUT_MS:-20000}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.svelte-kit
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
      - VITE_API_MODE=mock
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  go-mod-cache:
